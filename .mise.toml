[tools]
go = "1.27.3"
golangci-lint = "2.15.0"

[tasks.build]
description = "Build every <project>/cmd/<command> into out/<project>/"
run = '''
for dir in */cmd; do
  project=${dir%/cmd}
  go build -o "out/$project/" "./$project/cmd/..."
done
'''

[tasks.test]
description = "Run all tests with the race detector"
run = "go test -race ./..."

[tasks.lint]
description = "Run golangci-lint (linters and formatter checks)"
run = "golangci-lint run"

[tasks.fmt]
description = "Format code with gofmt and goimports"
run = "golangci-lint fmt"

[tasks.ci]
description = "Everything CI runs"
depends = ["lint", "test", "build"]

[tasks.run]
description = "Run a command, e.g. mise run run protohackers/speeddaemon -- -log=debug"
usage = '''
arg "<command>" help="<project>/<command>, for ./<project>/cmd/<command>"
arg "[args]..." help="Arguments passed to the command" var=#true
'''
run = '''
project=${usage_command%/*}
cmd=${usage_command##*/}
[ -d "$project/cmd/$cmd" ] || { echo "no command at ./$project/cmd/$cmd" >&2; exit 2; }
eval 'go run "./$project/cmd/$cmd"' "${usage_args:-}"
'''

[tasks.publish]
description = "Cross-compile one command for linux/amd64 and scp it to host yoda"
usage = 'arg "<command>" help="<project>/<command>, for ./<project>/cmd/<command>"'
env = { GOOS = "linux", GOARCH = "amd64" }
run = '''
project=${usage_command%/*}
cmd=${usage_command##*/}
[ -d "$project/cmd/$cmd" ] || { echo "no command at ./$project/cmd/$cmd" >&2; exit 2; }
go build -o "out/linux_amd64/$project/" "./$project/cmd/$cmd"
scp "out/linux_amd64/$project/$cmd" yoda:
'''
